osm_nav:
  ros__parameters:
    # Filename under this package's maps/, or an absolute OSM/XML path.
    map_file: 0924_4.osm
    host: 127.0.0.1
    port: 8090

    # Machine-dog pedestrian-demo planning parameters.
    topo_setting_yaml: /home/dow/DOW/dinov3/lanelet2/src/osm_nav/config/topo_setting.yaml
    topo_setting_chose: car

    # Web UI defaults. Smaller values permit deeper map zoom.
    default_display_mode: compact
    min_zoom_width: 2.0

    # Background tiles: openstreetmap (street map), esri_satellite (imagery),
    # or none (only the local OSM vector overlays). OSM has no satellite tiles.
    use_base_map: esri_satellite
    # use_base_map: none

    # Optional PCD/OSM alignment inspection layer (off in the browser by default).
    pcd_overlay: true
    pcd: /home/dow/DOW/dinov3/lanelet2/gps_map/map.pcd
    manifest_yaml: /home/dow/DOW/dinov3/lanelet2/gps_map/manifest.yaml
    # New paired_*.yaml exports from the 3D PCD/OSM editor are saved here.
    pair_files_dir: /home/dow/DOW/dinov3/lanelet2/src/osm_nav/pair_files

    # Navigation runtime mode. Each mode's exclusive parameters are grouped in
    # the matching mode_<number> section below.
    # 0: freely select start/goal in the web UI; 1: start is read from Odometry.
    mode: 0

    # Mode 0 has no ROS-specific parameters. Keep this explicit section so
    # future mode-0 options do not get mixed with other modes.
    mode_0: {}

    # Mode 1: route start follows ROS Odometry and the route is published as a
    # ROS Path. These settings are ignored by mode 0.
    mode_1:
      odometry_topic: /Odometry
      global_path_topic: /global_path
      slam_frame_id: map
      stop_nav: /stop
      # Must match cmd_vel_mux.override_topic in the downstream navigation stack.
      stop_override_topic: /cmd_vel/final_align
      # Start waiting this many metres before a signal-controlled pedestrian way.
      signal_stop_distance_m: 2.0

      # Pair file for the SLAM (x,y, metres) <-> WGS-84 (latitude, longitude)
      # affine least-squares transform.
      paired_yaml: /home/dow/DOW/dinov3/lanelet2/src/osm_nav/pair_files/paired.yaml
