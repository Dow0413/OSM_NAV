galileo_osm_nav:
  ros__parameters:
    # Filename under lanelet2_maps/res, or an absolute OSM/XML path.
    map_file: /home/dow/DOW/dinov3/lanelet2/src/galileo_osm_nav/maps/0924_4.osm
    host: 127.0.0.1
    port: 8090

    # Machine-dog pedestrian-demo planning parameters.
    robot_dog_speed_mps: 1.0
    signal_wait_seconds: 20.0
    safety_multipliers:
      footway: 1.0
      pedestrian: 1.0
      path: 1.1
      steps: 1.5
      living_street: 1.2
      service: 1.3
      residential: 1.5
      unclassified: 1.8
      track: 1.8
      tertiary: 2.5
      secondary: 3.0
      primary: 4.0

    # Web UI defaults. Smaller values permit deeper map zoom.
    default_display_mode: compact
    min_zoom_width: 2.0

    # Satellite base map switch. false keeps the local OSM vector canvas only.
    use_leaflet: true

    # Optional PCD/OSM alignment inspection layer (off in the browser by default).
    pcd_overlay: true
    pcd_map_dir: /home/dow/DOW/dinov3/lanelet2/galileo_map

    # 0: freely select start/goal in the web UI; 1: start is read from Odometry.
    mode: 1

    # ROS interfaces used only when mode is 1.
    odometry_topic: /Odometry
    global_path_topic: /global_path
    slam_frame_id: map
    stop_nav: /stop
    # Must match cmd_vel_mux.override_topic in the downstream navigation stack.
    stop_override_topic: /cmd_vel/final_align
    # Start waiting this many metres before a signal-controlled pedestrian way.
    signal_stop_distance_m: 2.0

    # Pair file for the SLAM (x,y, metres) <-> WGS-84 (latitude, longitude)
    # affine least-squares transform.
    paired_yaml: /home/dow/DOW/dinov3/lanelet2/src/galileo_osm_nav/config/paired.yaml
