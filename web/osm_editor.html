:root{font-family:"Noto Sans",system-ui,sans-serif;color:#273238;background:#f1f3f2}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:370px 1fr}.side{overflow:auto;background:#fff;border-right:1px solid #ccd4d0;box-shadow:2px 0 10px #00000016;z-index:2}.brand{padding:18px 18px 14px;background:#263b36;color:#fff}.brand h1{margin:0;font-size:21px;letter-spacing:.2px}.brand p{color:#dbe7e2;margin:5px 0 0;font-size:12px;line-height:1.5}.content{padding:14px 16px 22px}.group{border-top:1px solid #dfe5e1;padding-top:13px;margin-top:13px}.title{font-weight:750;color:#263b36;font-size:13px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool-grid button{margin:0}.tool-grid button:first-child{grid-column:span 2}button,select,textarea{font:inherit}button{width:100%;padding:9px 10px;margin:4px 0;border:1px solid #bfcac4;border-radius:4px;background:#fff;color:#31423c;cursor:pointer;transition:.12s}button:hover{background:#f0f5f2}button.active,button.primary{background:#397c53;border-color:#397c53;color:#fff}button.danger{color:#b43c32;border-color:#dfa9a3}button:disabled{opacity:.48;cursor:not-allowed}label{display:block;font-size:12px;color:#53635d;margin:7px 0 4px}select{width:100%;border:1px solid #bcc8c1;border-radius:4px;padding:8px;background:#fff}.switches{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px}.switches label{margin:0;padding:7px;background:#f5f7f6;border-radius:4px}.meta{font:12px ui-monospace,monospace;white-space:pre-wrap;background:#f4f7f5;border-left:3px solid #76aa80;border-radius:3px;padding:9px;margin:7px 0}textarea{width:100%;min-height:120px;padding:8px;border:1px solid #bcc8c1;border-radius:4px;font:12px ui-monospace,monospace}.note{font-size:12px;line-height:1.55;color:#5d6b66;white-space:pre-line}.small{font-size:11px;color:#6f7e77;line-height:1.5}.back{display:block;margin-top:14px;color:#28704b;font-size:13px;text-d </style></head><body><aside class="side"><div class="brand"><h1>OSM Map Editor</h1><p>使用 OSM 标签、道路样式与卫星影像进行本地地图编辑</p></div><div class="content"><div class="group"><div class="title">编辑操作</div><p class="note">使用地图上方中间的工具栏切换选择、添加点、添加线和添加区域。绘制线或区域时按 <b>Enter</b> 完成，按 <b>Esc</b> 取消。</p><button id="undo-draft">撤销最后一个绘制点</button><button id="cancel">取消当前绘制</button></div><div class="group"><div class="title">属性预设</div><label>对象类别</label><select id="preset"><option value="">选择预设后应用标签…</option></select><button id="apply-preset">应用预设到选中对象</button><div class="small">预设仅填充常用 OSM 标签；仍可在下方自由编辑 JSON。</div></div><div class="group"><div class="title">显示</div><div class="switches"><label><input id="street" type="checkbox"> OSM 标准底图</label><label><input id="satellite" type="checkbox" checked> 卫星影像</label><label><input id="show-roads" type="checkbox" checked> 道路与线</label><label><input id="show-areas" type="checkbox" checked> 建筑与区域</label><label><input id="show-points" type="checkbox" checked> 有标签点</label><label><input id="show-labels" type="checkbox" checked> 名称标注</label></div><button id="fit">缩放至 OSM 范围</button></div><div class="group"><div class="title">选中对象</div><div id="meta" class="meta">未选中对象</div><label>通用 OSM 标签（JSON）</label><textarea id="tags" placeholder='例如：{"highway":"footway","name":"新道路"}' disabled>{}</textarea><button id="apply-tags" disabled>应用通用标签</button><button id="delete" class="danger" disabled>删除选中对象</button></div><div class="group"><button id="save" class="primary" disabled>备份并保存 OSM 地图</button><button id="reload">放弃草稿并重新加载</button><div id="status" class="note">正在加载 OSM 数据…</div></div><a class="back" href="index.html">← 返回导航页面</a></div></aside><main id="map-shell"><div id="map"></div><div class="map-tools"><button class="active" data-mode="select">⌖ 选择/移动</button><button data-mode="point">＋ 点</button><button data-mode="line">╱ 线</button><button data-mode="area">▱ 区域</button><button id="map-finish" disabled>完成 ↵</button><button id="finish" hidden disabled></button></div><div id="draw-hint" class="draw-hint">选择或拖动要素进行编辑</div><div id="middle-menu" class="middle-menu"><button id="menu-delete" class="danger">删除</button><button id="menu-split">从该点分割线</button></div><div class="map-legend"><b>道路类别图例</b><div class="legend-grid"><span class="legend-item"><i class="legend-line" class="legend-line dash" style="border-color:#d691d0"></i>footway</span><span class="legend-item"><i class="legend-line dash" style="border-color:#b77bbb"></i>path</span><span class="legend-item"><i class="legend-line dash" style="border-color:#a467b8"></i>pedestrian</span><span class="legend-item"><i class="legend-line dash" style="border-color:#8262a5"></i>steps</span><span class="legend-item"><i class="legend-line" class="legend-line dash" style="border-color:#e7ae63"></i>living_street</span><span class="legend-item"><i class="legend-line" class="legend-line dash" style="border-color:#fff"></i>service</span><span class="legend-item"><i class="legend-line" style="border-color:#fff"></i>residential</span><span class="legend-item"><i class="legend-line" class="legend-line dash" style="border-color:#d9d9d9"></i>unclassified</span><span class="legend-item"><i class="legend-line dash" style="border-color:#998661"></i>track</span><span class="legend-item"><i class="legend-line" class="legend-line dash" style="border-color:#fff5aa"></i>tertiary</span><span class="legend-item"><i class="legend-line" class="legend-line dash" style="border-color:#f1dc72"></i>secondary</span><span class="legend-item"><i class="legend-line" style="border-color:#f5b743"></i>primary</span></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const map=L.map('map',{zoomControl:true,maxZoom:20});L.DomEvent.disableClickPropagation(document.querySelector('.map-tools'));const base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Esri'}).addTo(map);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap contributors'});const layers={ways:L.layerGroup().addTo(map),points:L.layerGroup().addTo(map),selected:L.layerGroup().addTo(map),draft:L.layerGroup().addTo(map)};let nodes=new Map(),ways=new Map(),mode='select',selected=null,draft=[],newNo=0,changedNodes=new Set(),changedWays=new Set(),deletedNodes=new Set(),deletedWays=new Set(),bounds,cursor=null,snapNodeId=null,menuTarget=null,splitFromNodeId=null,splitCandidateWayId=null;const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;const isNew=id=>String(id).startsWith('new-');const tagsOf=o=>o.tags||{};const coords=w=>w.nodes.map(id=>nodes.get(id)).filter(Boolean).map(n=>[n.lat,n.lon]);const closed=w=>w.nodes.length>3&&w.nodes[0]===w.nodes.at(-1);const lineNodeIds=()=>new Set([...ways.values()].filter(w=>!deletedWays.has(w.id)).flatMap(w=>w.nodes));function nearestLineNode(latlng){const pointer=map.latLngToContainerPoint(latlng);let best=null,bestDistance=18;for(const id of lineNodeIds()){const n=nodes.get(id);if(!n||deletedNodes.has(id))continue;const d=pointer.distanceTo(map.latLngToContainerPoint([n.lat,n.lon]));if(d<bestDistance){bestDistance=d;best=id}}return best}function closeMenu(){$('middle-menu').classList.remove('show');menuTarget=null}function splitWayForNode(nodeId){const current=selected?.type==='way'&&!closed(ways.get(selected.id))&&ways.get(selected.id).nodes.includes(nodeId)?selected.id:null;return current||[...ways.values()].find(w=>!deletedWays.has(w.id)&&!closed(w)&&w.nodes.indexOf(nodeId)>0&&w.nodes.indexOf(nodeId)<w.nodes.length-1)?.id}function showMenu(latlng,target){const splitWayId=target.type==='way'&&!closed(ways.get(target.id))?target.id:target.type==='node'?splitWayForNode(target.id):null;menuTarget={...target,latlng,splitWayId};select(target);const p=map.latLngToContainerPoint(latlng),menu=$('middle-menu');menu.style.left=`${p.x+8}px`;menu.style.top=`${p.y+8}px`;menu.classList.add('show');$('menu-split').style.display=splitWayId?'block':'none'}function splitSelectedLine(latlng){const wayId=menuTarget?.splitWayId;if(!wayId)return;const way=ways.get(wayId);if(!way||closed(way))return;let split,best;if(menuTarget.type==='node'){split=menuTarget.id;best=way.nodes.indexOf(split);if(best<=0||best>=way.nodes.length-1)return}else{best=0;let bestDistance=Infinity;for(let i=0;i<way.nodes.length-1;i++){const a=map.latLngToLayerPoint(coords(way)[i]),b=map.latLngToLayerPoint(coords(way)[i+1]),p=map.latLngToLayerPoint(latlng),ab=b.subtract(a),den=ab.x*ab.x+ab.y*ab.y,t=den?Math.max(0,Math.min(1,((p.x-a.x)*ab.x+(p.y-a.y)*ab.y)/den)):0,q=L.point(a.x+t*ab.x,a.y+t*ab.y),d=p.distanceTo(q);if(d<bestDistance){bestDistance=d;best=i}}split=addNode(latlng);best+=1;way.nodes.splice(best,0,split)}const left=way.nodes.slice(0,best+1),right=way.nodes.slice(best);way.nodes=left;if(!isNew(way.id))changedWays.add(way.id);const id=`new-${++newNo}`;ways.set(id,{id,nodes:right,tags:{...way.tags}});closeMenu();select({type:'way',id});markDirty();status('已将线分割为两段。')}const style=w=>{const t=tagsOf(w),h=t.highway;if(t.building)return{color:'#786b5d',fillColor:'#c9b9a7',fillOpacity:.78,weight:1.2};if(closed(w)||t.landuse||t.natural){const c=t.natural==='water'?'#75b7d4':t.landuse==='forest'||t.natural==='wood'?'#75a66c':t.landuse==='residential'?'#e8d5ad':'#a6b98e';return{color:c,fillColor:c,fillOpacity:.38,weight:1.2};}const styles={primary:['#f5b743',5.5],secondary:['#f1dc72',5,'14 3'],tertiary:['#fff5aa',4,'9 3'],unclassified:['#d9d9d9',3.3,'4 3'],residential:['#fff',3.5],service:['#fff',2.6,'2 4'],living_street:['#e7ae63',3.2,'10 3'],footway:['#d691d0',2.6,'2 3'],pedestrian:['#a467b8',3,'7 3'],path:['#b77bbb',2,'4 4'],steps:['#8262a5',2.4,'1 2'],track:['#998661',2.6,'10 5'],cycleway:['#5cb8cf',2.7,'8 2']};const x=styles[h]||['#e6e9e6',2.3];return{color:x[0],weight:x[1],dashArray:x[2],lineCap:'round',lineJoin:'round'};};function markDirty(){ $('save').disabled=!(changedNodes.size||changedWays.size||deletedNodes.size||deletedWays.size||[...nodes].some(([id])=>isNew(id))||[...ways].some(([id])=>isNew(id))); }
function render(){const showRoads=$('show-roads').checked,showAreas=$('show-areas').checked,showPoints=$('show-points').checked,showLabels=$('show-labels').checked;layers.ways.clearLayers();layers.points.clearLayers();layers.selected.clearLayers();layers.draft.clearLayers();for(const w of ways.values()){if(deletedWays.has(w.id))continue;const t=tagsOf(w),area=closed(w)||t.building||t.landuse||t.natural;if((area&&!showAreas)||(!area&&!showRoads))continue;const c=coords(w);if(c.length<2)continue;const shape=closed(w)?L.polygon(c,style(w)):L.polyline(c,style(w));shape.on('click',e=>{L.DomEvent.stopPropagation(e);closeMenu();if(splitFromNodeId){const index=w.nodes.indexOf(splitFromNodeId);if(closed(w)||index<=0||index>=w.nodes.length-1){status('该线不能在此点分割：请选择经过该点且该点不在端部的非闭合线。');return}splitCandidateWayId=w.id;render();$('draw-hint').textContent='目标线已橙色高亮；按 Enter 从指定点分割，Esc 取消。';status('目标线已选择。按 Enter 确认分割。');return}select({type:'way',id:w.id})}).on('mousedown',e=>{if(e.originalEvent.button===2){L.DomEvent.stop(e.originalEvent);showMenu(e.latlng,{type:'way',id:w.id})}});shape.addTo(layers.ways);if(showLabels&&t.name){const size=Math.max(8,Math.min(15,8+(map.getZoom()-14)*.9));L.marker(c[Math.floor(c.length/2)],{interactive:false,icon:L.divIcon({className:'osm-label',html:`<span style=\"font-size:${size}px\">${t.name}</span>`,iconSize:[0,0],iconAnchor:[0,0]})}).addTo(layers.ways)}}for(const n of nodes.values())if(showPoints&&!deletedNodes.has(n.id)&&Object.keys(tagsOf(n)).length){L.circleMarker([n.lat,n.lon],{radius:6,color:'#fff',fillColor:'#9b4cc5',fillOpacity:1,weight:2}).on('click',e=>{L.DomEvent.stopPropagation(e);closeMenu();select({type:'node',id:n.id})}).on('mousedown',e=>{if(e.originalEvent.button===2){L.DomEvent.stop(e.originalEvent);showMenu(e.latlng,{type:'node',id:n.id})}}).addTo(layers.points)}if(selected){const obj=selected.type==='node'?nodes.get(selected.id):ways.get(selected.id);if(!obj){selected=null}else if(selected.type==='node'){vertex(obj,true)}else{const c=coords(obj);(closed(obj)?L.polygon(c,{color:'#2ee6b6',weight:14,opacity:.25,fillColor:'#2ee6b6',fillOpacity:.12,interactive:false}):L.polyline(c,{color:'#2ee6b6',weight:15,opacity:.28,interactive:false})).addTo(layers.selected);(closed(obj)?L.polygon(c,{color:'#fff',weight:6,fill:false,interactive:false}):L.polyline(c,{color:'#fff',weight:7,interactive:false})).addTo(layers.selected);(closed(obj)?L.polygon(c,{color:'#1a9a78',weight:3,fill:false,interactive:false}):L.polyline(c,{color:'#1a9a78',weight:4,interactive:false})).addTo(layers.selected);[...new Set(obj.nodes)].forEach(id=>{const n=nodes.get(id);if(n)vertex(n,false)})}}if(splitCandidateWayId){const candidate=ways.get(splitCandidateWayId),c=candidate&&coords(candidate);if(c?.length){L.polyline(c,{color:'#ff8a2a',weight:15,opacity:.32,interactive:false}).addTo(layers.selected);L.polyline(c,{color:'#ff8a2a',weight:5,interactive:false}).addTo(layers.selected)}}if(snapNodeId){const n=nodes.get(snapNodeId);if(n)L.circleMarker([n.lat,n.lon],{radius:12,color:'#ffe75b',weight:3,fill:false,interactive:false}).addTo(layers.draft)}if(draft.length){const c=draft.map(id=>{const n=nodes.get(id);return[n.lat,n.lon]});const preview=cursor?[...c,[cursor.lat,cursor.lng]]:c;if(mode==='area'&&preview.length>2)L.polygon([...preview,preview[0]],{color:'#397c53',fillColor:'#67b77a',fillOpacity:.25,weight:3,dashArray:'7 5',interactive:false}).addTo(layers.draft);else L.polyline(preview,{color:'#397c53',weight:4,dashArray:'7 5',interactive:false}).addTo(layers.draft)} }
